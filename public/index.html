<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Teacher Quiz Online</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<meta name="description" content="Teacher Quiz Online — uč sa angličtinu vlastným tempom, odkiaľkoľvek a kedykoľvek.">
<meta name="theme-color" content="#3d5d78">
<style>
  :root{
    --bg:#e8dcb8; --bg-2:#efe3c8; --panel:#f7f0dc; --panel-2:#efe2c0;
    --gold:#3d5d78; --gold-dim:#2c4759; --gold-diploma:#a67c3d;
    --parchment:#f3e8cf; --parchment-ink:#3a2c14; --parchment-line:#c9b487;
    --correct:#4f7a45; --correct-bg:rgba(79,122,69,.14);
    --wrong:#b3453a; --wrong-bg:rgba(179,69,58,.14);
    --locked:#c2af86; --text:#3a2f22; --text-muted:#6b5a3e; --border:#cbb488;
    --sea:#7fa3ac; --twine:#a6875a;
    --font-display:Georgia,'Times New Roman',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    --font-hand:'Segoe Script','Bradley Hand','Comic Sans MS',cursive;
    --font-num:'Consolas','SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      repeating-linear-gradient(rgba(58,47,34,.045) 0 1px, transparent 1px 28px),
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(ellipse 800px 550px at 100% 110%, rgba(58,47,34,.07), transparent 60%),
      var(--bg-2);
    color:var(--text); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    display:flex; justify-content:center; padding:32px 20px 60px;
  }
  .wrap{width:100%;max-width:900px;}
  button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;}
  input{font-family:inherit;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  ::selection{background:var(--gold);color:#fdfaf0;}

  .brand{text-align:center;margin-bottom:22px;}
  .bulbs{
    height:10px;max-width:420px;margin:0 auto 14px;
    background-image:radial-gradient(circle, var(--gold-dim) 0 2.5px, transparent 3px);
    background-size:24px 10px;background-repeat:repeat-x;background-position:center;opacity:.45;
  }
  .brand h1{
    display:inline-block;font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    font-size:clamp(26px,5vw,42px);margin:0;text-wrap:balance;
    color:var(--wrong);transform:rotate(-1.3deg);
    text-shadow:1.5px 1.5px 0 rgba(58,47,34,.18), -0.5px -0.5px 0 rgba(179,69,58,.25);
    animation:heroIn .6s ease both;
  }
  @keyframes heroIn{ from{opacity:0; transform:rotate(-1.3deg) translateY(-8px) scale(.97);} to{opacity:1; transform:rotate(-1.3deg) translateY(0) scale(1);} }
  .brand .compass{font-size:.85em;vertical-align:-4px;margin-right:4px;display:inline-block;filter:drop-shadow(1px 2px 0 rgba(58,47,34,.25));animation:compassSpin 8s linear infinite;}
  @keyframes compassSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .brand .sub{margin:8px 0 0;color:var(--text-muted);font-size:16px;font-family:var(--font-hand);font-style:italic;}

  .topnav{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 22px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;
    box-shadow:0 4px 10px rgba(58,47,34,.12);
  }
  .topnav:empty{display:none;}
  .topnav .who{font-size:12.5px;color:var(--text-muted);margin-right:auto;display:flex;align-items:center;gap:8px;}
  .topnav .who b{color:var(--text);}
  .topnav .who-avatar{
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:11px;color:#1a1200;border:1.5px solid #fdfaf0;
    box-shadow:0 1px 3px rgba(58,47,34,.3);flex:none;
  }
  .topnav .who-avatar-img{
    width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;
    border:1.5px solid #fdfaf0;box-shadow:0 1px 3px rgba(58,47,34,.3);
  }

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:32px;
    box-shadow:0 14px 30px rgba(58,47,34,.16), 0 2px 0 rgba(255,255,255,.5) inset;
    animation:cardIn .3s ease both;
  }
  @keyframes cardIn{ from{opacity:0; transform:translateY(8px) scale(.985);} to{opacity:1; transform:translateY(0) scale(1);} }
  @media (max-width:600px){ .panel{padding:20px 16px;border-radius:8px;} body{padding:18px 12px 40px;} }

  h2.section-title{font-family:var(--font-display);font-weight:700;font-size:23px;margin:0 0 4px;color:var(--text);}
  p.hint{color:var(--text-muted);font-size:14.5px;line-height:1.55;margin:0 0 20px;}

  .btn{
    position:relative;min-height:44px;border-radius:6px;border:1.5px solid var(--border);background:var(--panel-2);color:var(--text);
    padding:12px 18px;font-size:14.5px;font-weight:600;font-family:var(--font-body);
    transition:transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    box-shadow:1.5px 1.5px 0 rgba(58,47,34,.18);
  }
  .btn:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:1.5px 2.5px 0 rgba(58,47,34,.2);}
  .btn:active{transform:translate(1px,1px);box-shadow:0 0 0 rgba(58,47,34,.18);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .btn:disabled:hover{border-color:var(--border);box-shadow:1.5px 1.5px 0 rgba(58,47,34,.18);}
  .btn-gold{
    background:var(--gold);color:#fdfaf0;border:1.5px solid var(--gold-dim);font-family:var(--font-display);
    text-transform:uppercase;letter-spacing:.04em;font-weight:700;box-shadow:2px 2px 0 var(--gold-dim);
  }
  .btn-gold:hover{background:var(--gold-dim);box-shadow:2px 3px 0 var(--gold-dim);}
  .btn-gold:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--gold-dim);}
  .btn-gold:disabled{opacity:.45;cursor:not-allowed;transform:none;background:var(--panel-2);color:var(--text-muted);box-shadow:none;border-color:var(--border);}
  .btn-sm{padding:8px 12px;font-size:12.5px;min-height:38px;}
  .btn-google{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    background:#fff;color:#3c4043;border:1.5px solid #dadce0;font-family:var(--font-body);font-weight:600;
    box-shadow:1.5px 1.5px 0 rgba(58,47,34,.12);
  }
  .btn-google:hover{border-color:#c6c9cd;background:#f8f9fa;box-shadow:1.5px 2.5px 0 rgba(58,47,34,.14);}
  .btn-google:active{transform:translate(1px,1px);}
  .btn-google:disabled{opacity:.6;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:6px;}
  .field input{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:12px 14px;font-size:15px;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(61,93,120,.18);}
  .msg{border-radius:8px;padding:12px 16px;font-size:14px;margin-bottom:16px;text-align:left;}
  .msg.info{background:var(--panel-2);border:1px dashed var(--border);color:var(--text);}
  .msg.error{background:var(--wrong-bg);border:1px solid var(--wrong);color:var(--wrong);}
  .msg.ok{background:var(--correct-bg);border:1px solid var(--correct);color:var(--correct);}
  .msg.error::before{content:'⚠️ ';}
  .msg.ok::before{content:'✅ ';}
  .msg.info::before{content:'ℹ️ ';}

  .or-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;}
  .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border);}

  .intro-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 20px;gap:14px;}
  .intro-icon{
    font-size:38px;width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse 80% 80% at 32% 26%, rgba(255,255,255,.85), var(--panel-2) 65%);
    border:3px solid var(--gold);
    box-shadow:0 10px 22px rgba(58,47,34,.25), inset 0 2px 5px rgba(255,255,255,.6), inset 0 -6px 10px rgba(58,47,34,.08);
  }
  .intro-wrap h2{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,4.6vw,32px);margin:0;text-wrap:balance;}
  .intro-wrap p{color:var(--text-muted);max-width:480px;font-size:15.5px;line-height:1.6;}
  .threshold-note{background:var(--panel-2);border:1px dashed var(--border);border-radius:8px;padding:10px 18px;font-size:13.5px;}
  .threshold-note b{color:var(--gold);}

  .progress-track{background:var(--panel-2);border-radius:99px;height:8px;overflow:hidden;width:100%;margin-top:10px;}
  .progress-fill{background:linear-gradient(90deg, var(--gold-dim), var(--gold));height:100%;border-radius:99px;transition:width .3s ease;}
  .qmeta{font-size:13px;color:var(--text-muted);display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .qmeta .pill{background:var(--panel-2);border:1px solid var(--gold);padding:4px 10px;border-radius:99px;}

  .stage-card{text-align:center;padding:44px 32px;position:relative;}
  @media (max-width:600px){.stage-card{padding:32px 18px;}}
  .stage-zone-badge{
    width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;
    margin:0 auto 14px;background:
      radial-gradient(ellipse 90% 130% at 30% 20%, rgba(255,255,255,.5), transparent 60%),
      var(--zc,var(--gold));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12), inset 0 2px 4px rgba(255,255,255,.3), 0 4px 10px rgba(58,47,34,.25);
  }
  .prompt-sk{color:var(--text-muted);font-size:13.5px;text-transform:uppercase;letter-spacing:.1em;margin:0 0 14px;}
  .prompt-main{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,5.4vw,48px);margin:0 0 8px;text-wrap:balance;line-height:1.1;}
  .prompt-main.emoji{font-size:clamp(56px,11vw,96px);line-height:1;filter:drop-shadow(0 4px 6px rgba(58,47,34,.25));}
  .sentence{font-family:var(--font-display);font-weight:700;font-size:clamp(19px,3.2vw,26px);line-height:1.4;text-wrap:balance;}
  .sentence .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--gold);color:var(--gold);}

  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0 6px;}
  @media (max-width:560px){.options{grid-template-columns:1fr;}}
  .opt{
    position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:#fdfaf0;
    border:2px solid var(--border);border-radius:6px;padding:14px 16px;font-size:16px;font-weight:600;color:var(--text);
    transition:border-color .15s ease, background .15s ease, transform .08s ease;
    box-shadow:2px 2px 0 rgba(58,47,34,.12); min-height:44px;
  }
  .opt .letter{
    font-family:var(--font-display);font-weight:700;color:#fdfaf0;font-size:13px;background:var(--gold);
    border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex:none;
    box-shadow:0 2px 4px rgba(58,47,34,.3);
  }
  .opt:hover{border-color:var(--gold);transform:translateY(-1px);}
  .opt.picked{border-color:var(--gold);background:rgba(61,93,120,.08);}
  .opt.reveal-correct{border-color:var(--correct);background:var(--correct-bg);}
  .opt.reveal-correct .letter{background:var(--correct);}
  .opt.reveal-wrong{border-color:var(--wrong);background:var(--wrong-bg);}
  .opt.reveal-wrong .letter{background:var(--wrong);}
  .opt:disabled{cursor:default;}
  .opt:disabled:hover{transform:none;}

  .reveal-box{margin-top:22px;}
  .answer-pill{display:inline-flex;flex-direction:column;gap:4px;background:var(--correct-bg);border:2px solid var(--correct);border-radius:8px;padding:14px 26px;}
  .answer-pill .en{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--correct);text-transform:uppercase;}
  .answer-pill .sk{font-size:13px;color:var(--text-muted);font-family:var(--font-hand);font-style:italic;}
  .controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap;}
  .auto-result{width:100%;text-align:center;font-family:var(--font-display);font-weight:700;font-size:18px;padding:10px 16px;border-radius:8px;}
  .auto-result.ok{color:var(--correct);background:var(--correct-bg);border:2px solid var(--correct);}
  .auto-result.bad{color:var(--wrong);background:var(--wrong-bg);border:2px solid var(--wrong);}

  .results-list{list-style:none;margin:0 auto 26px;padding:0;max-width:420px;}
  .stat-row{display:flex;justify-content:space-between;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:8px;font-size:14.5px;}
  .badge{font-family:var(--font-display);font-size:11.5px;letter-spacing:.05em;padding:5px 10px;border-radius:99px;text-transform:uppercase;}
  .badge.pass{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct);}
  .badge.fail{background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong);}

  .dest-choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;width:100%;margin-top:10px;}
  .dest-choice-card{
    background:#fdfaf0;border:1px solid var(--border);border-radius:6px;padding:0 14px 18px;text-align:center;overflow:hidden;
    transition:transform .14s ease, box-shadow .14s ease; box-shadow:0 6px 14px rgba(58,47,34,.2);
  }
  .dest-choice-card:hover{transform:translateY(-4px);box-shadow:0 12px 22px rgba(58,47,34,.28);}
  .dest-choice-card .dtop{height:8px;margin:0 -14px 18px;background:var(--dc,var(--gold));}
  .dest-choice-card .flag{font-size:34px;filter:drop-shadow(0 3px 3px rgba(58,47,34,.3));}
  .dest-choice-card .dname{font-weight:700;margin:8px 0 12px;font-family:var(--font-hand);font-size:17px;}
  .dest-choice-card .btn{width:100%;}

  .journey-path{
    position:relative;display:flex;justify-content:space-between;align-items:flex-start;
    margin:18px 0 8px;padding:14px 6px 0;
  }
  .journey-path::before{
    content:'';position:absolute;top:33px;left:5%;right:5%;height:0;
    border-top:3px dashed var(--twine);opacity:.55;z-index:0;
  }
  .jp-node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0;}
  .jp-dot{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;
    background:var(--panel-2);border:2.5px solid var(--border);color:var(--text-muted);
    box-shadow:0 3px 6px rgba(58,47,34,.18);transition:transform .18s ease, box-shadow .18s ease;
  }
  .jp-node.done .jp-dot{background:var(--zc,var(--correct));border-color:var(--zc,var(--correct));color:#fff;opacity:.85;}
  .jp-node.current .jp-dot{
    background:var(--zc,var(--gold));border-color:#fdfaf0;color:#fff;transform:scale(1.18);
    box-shadow:0 0 0 3px var(--zc,var(--gold)), 0 6px 14px rgba(58,47,34,.35);
  }
  .jp-label{font-size:10px;font-weight:700;color:var(--text-muted);text-align:center;line-height:1.15;max-width:60px;}
  .jp-node.current .jp-label{color:var(--text);}
  @media (max-width:600px){
    .journey-path{padding-top:6px;}
    .journey-path::before{top:19px;}
    .jp-dot{width:30px;height:30px;font-size:14px;}
    .jp-label{display:none;}
  }

  .finish-wrap{text-align:center;padding:30px 10px;}
  .finish-wrap .big-score{font-family:var(--font-num);font-size:44px;font-weight:800;color:var(--gold);margin:10px 0;}

  /* leaderboard */
  .lb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .lb-row{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;transition:transform .12s ease;}
  .lb-row:hover{transform:translateX(2px);}
  .lb-row.me{border-color:var(--gold);box-shadow:0 0 0 2px rgba(61,93,120,.18);}
  .lb-row.top3{background:linear-gradient(90deg, rgba(240,178,62,.14), var(--panel-2) 60%);}
  .lb-rank{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--border);color:var(--text-muted);}
  .lb-row.rank-1 .lb-rank{background:#f0b23e;color:#fff;border-color:#c98f22;}
  .lb-row.rank-2 .lb-rank{background:#b9c2c9;color:#fff;border-color:#8f979e;}
  .lb-row.rank-3 .lb-rank{background:#c98f5c;color:#fff;border-color:#a06d3e;}
  .lb-avatar{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;color:#1a1200;border:1.5px solid #fdfaf0;box-shadow:0 1px 3px rgba(58,47,34,.3);}
  .lb-main{flex:1;min-width:0;}
  .lb-name{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;}
  .lb-loc{font-size:12px;color:var(--text-muted);margin-bottom:4px;}
  .lb-bar{display:block;background:rgba(58,47,34,.1);border-radius:99px;height:5px;overflow:hidden;width:100%;max-width:180px;}
  .lb-bar-fill{display:block;background:linear-gradient(90deg, var(--gold), var(--gold-dim));height:100%;border-radius:99px;transition:width .4s ease;}
  .lb-score{font-family:var(--font-num);font-weight:700;font-size:16px;flex:none;}
  .flag-chip{display:inline-block;width:1.4em;height:1em;border-radius:.15em;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);vertical-align:middle;flex:none;}
  .flag-chip.flag-ru{background:linear-gradient(180deg,#fff 0 33%,#0039a6 33% 66%,#d52b1e 66%);}
  .flag-chip.flag-fr{background:linear-gradient(90deg,#0055a4 0 33%,#fff 33% 66%,#ef4135 66%);}
  .flag-chip.flag-es{background:linear-gradient(180deg,#aa151b 0 25%,#f1bf00 25% 75%,#aa151b 75%);}
  .flag-chip.flag-sk{background:linear-gradient(180deg,#fff 0 33%,#0b4ea2 33% 66%,#ee1c25 66%);}

  /* ---------- text-input answers (fill / riddle / emoji / scramble) ---------- */
  .text-answer-wrap{display:flex;justify-content:center;margin:24px 0 6px;}
  .text-answer-input{
    width:100%;max-width:340px;text-align:center;font-size:19px;font-weight:700;font-family:var(--font-body);
    background:#fdfaf0;border:2px solid var(--border);border-radius:6px;padding:12px 16px;color:var(--text);
    transition:border-color .15s ease, background .15s ease;
  }
  .text-answer-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(61,93,120,.18);}
  .text-answer-input.ok{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);}
  .text-answer-input.bad{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong);}
  .scramble-word{
    font-family:var(--font-num);font-weight:700;letter-spacing:.18em;font-size:clamp(24px,5vw,38px);
    color:var(--gold);margin:6px 0 0;
  }

  /* ---------- word-order (sentence building) ---------- */
  .order-answer-row{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px;align-items:center;
    margin:20px auto 14px;max-width:520px;padding:10px;border:2px dashed var(--border);border-radius:8px;background:var(--panel-2);
  }
  .order-placeholder{color:var(--text-muted);font-size:13.5px;font-style:italic;}
  .order-chip{
    font-family:var(--font-body);font-weight:600;font-size:15px;padding:8px 14px;border-radius:6px;
    border:2px solid var(--border);background:#fdfaf0;color:var(--text);box-shadow:2px 2px 0 rgba(58,47,34,.12);
    transition:transform .1s ease, opacity .15s ease;
  }
  .order-chip.picked{border-color:var(--gold);background:rgba(61,93,120,.08);}
  .order-chip.bank:disabled{opacity:.35;cursor:not-allowed;}
  .order-chip:not(:disabled):hover{transform:translateY(-2px);border-color:var(--gold);}

const DEST_COLORS = {ru:'#c9564d', fr:'#4169b0', es:'#c9a227'};
function destTotal(code){ return DESTINATIONS[code].stops.reduce((sum,s)=>sum+s.questions.length,0); }
function journeyProgressPct(p){
  if(p.destination){
    const dest = DESTINATIONS[p.destination];
    const totalQ = destTotal(p.destination);
    let done = 0;
    for(let i=0;i<p.destStopIdx;i++) done += dest.stops[i].questions.length;
    done += p.destQIdx;
    return totalQ ? Math.round((done/totalQ)*100) : 0;
  }
  const totalQ = MAP_STOPS.reduce((s,st)=>s+st.questions.length,0);
  let done = 0;
  for(let i=0;i<p.stopIdx;i++) done += MAP_STOPS[i].questions.length;
  done += p.qIdx;
  return totalQ ? Math.round((done/totalQ)*100) : 0;
}
function questionsRemainingInCurrentStop(){
  if(progress.destination){
    const dest = DESTINATIONS[progress.destination];
    const stop = dest.stops[progress.destStopIdx];
    return stop ? stop.questions.length - progress.destQIdx : 0;
  }
  if(progress.reachedAirport) return 0;
  const stop = currentStop();
  return stop ? stop.questions.length - progress.qIdx : 0;
}

/* ================= helpers ================= */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function bodWord(n){ if(n===1) return 'bod'; if(n>=2 && n<=4) return 'body'; return 'bodov'; }
function shuffleArr(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shuffleQuestionOptions(q){ if(!q.options) return q; const order=shuffleArr(q.options.map((_,i)=>i)); return {...q, options:order.map(i=>q.options[i]), answer:order.indexOf(q.answer)}; }
function zoneOf(id){ return ZONES.find(z=>z.id===id); }
function initials(name){ return (String(name).trim()[0]||'?').toUpperCase(); }
function avatarColor(uid){ let h=0; for(let i=0;i<uid.length;i++) h=(h*31+uid.charCodeAt(i))>>>0; return PLAYER_COLORS[h % PLAYER_COLORS.length]; }
function normalizeAnswer(s){ return String(s||'').trim().toLowerCase().replace(/^(a|an|the)\s+/,'').replace(/[.,!?']/g,''); }
function scrambleWord(word){
  let letters, tries=0;
  do{ letters = shuffleArr(word.split('')); tries++; } while(letters.join('')===word && tries<8);
  return letters.join('');
}
function isAnswerCorrect(type, q){
  if(type==='mc' || type==='finale' || type==='truefalse') return ui.pickedOption!==null && ui.pickedOption===q.answer;
  if(type==='order') return ui.orderPicks.join(' ')===q.words.join(' ');
  // fill / riddle / emoji / scramble: typed text answer
  return ui.textAnswer.trim()!=='' && normalizeAnswer(ui.textAnswer)===normalizeAnswer(q.answer);
}

function defaultProgress(email){
  return {
    email, displayName:'',
    entryScore:null, passed:null,
    score:0, stopIdx:0, qIdx:0,
    reachedAirport:false, finished:false,
    destination:null, destStopIdx:0, destQIdx:0, destScore:0, destFinished:false,
    stopStats:{},
    testQueue:null, testIdx:0,
  };
}
function rankScore(p){
  let r = (p.stopIdx||0)*100 + (p.score||0);
  if(p.reachedAirport) r += MAP_STOPS.length*100;
  if(p.destination){
    r += 10000 + (p.destStopIdx||0)*200 + (p.destScore||0);
    if(p.destFinished) r += 5000;
  }
  return r;
}
function locationLabel(p){
  if(p.destination){
    const dest = DESTINATIONS[p.destination];
    if(p.destFinished) return `🏁 ${dest.name} — hotovo`;
    return `${dest.name} · zastávka ${(p.destStopIdx||0)+1}/${dest.stops.length}`;
  }
  if(p.reachedAirport) return '✈️ Letisko';
  if(!p.passed) return '📝 Vstupný test';
  const stop = MAP_STOPS[p.stopIdx];
  if(!stop) return '✈️ Letisko';
  const zone = zoneOf(stop.zone);
  return `${zone.icon} ${zone.label}`;
}

async function handleAuthEntry(){
  try{
    await getRedirectResult(auth);
  }catch(e){
    ui.authMsg = { type:'error', text:'Prihlásenie zlyhalo: '+e.message };
  }
  onAuthStateChanged(auth, async (user)=>{
    currentUser = user;
    if(user && user.isAnonymous){
      // guest: nothing ever read from or written to Firestore
      progress = defaultProgress('');
      ui.screen = 'nickname';
    } else if(user){
      try{
        const ref = doc(db, 'progress', user.uid);
        const snap = await getDoc(ref);
        if(snap.exists()){
          progress = { ...defaultProgress(user.email), ...snap.data() };
        } else {
          progress = defaultProgress(user.email);
          await setDoc(ref, { ...progress, rankScore:0, updatedAt: Date.now() });
        }
        ui.screen = progress.displayName ? (progress.passed ? 'stage' : (progress.passed===false ? 'testResult' : 'testIntro')) : 'nickname';
      }catch(e){
        progress = defaultProgress(user.email);
        ui.screen = 'nickname';
        ui.authMsg = { type:'error', text:'Nepodarilo sa načítať uložený postup, začíname odznova: '+e.message };
      }
    } else {
      progress = null;
      ui.screen = 'login';
    }
    if(ui.screen==='nickname' && !ui.nameInput && user && !user.isAnonymous && user.displayName){
      ui.nameInput = user.displayName.slice(0,24);
    }
    render();
  });
}

  const q = progress.testQueue[progress.testIdx];

/* ================= main journey (solo) ================= */
function currentStop(){ return MAP_STOPS[progress.stopIdx]; }
function resetAnswerUi(){ ui.revealed=false; ui.pickedOption=null; ui.textAnswer=''; ui.orderPicks=[]; }

/* Each question is "prepared" (options shuffled / word order shuffled / word scrambled) exactly once
   per visit so the correct answer isn't always in the same spot, but re-renders (pick, reveal) don't
   reshuffle mid-question. */
let preparedQCache = { key:null, q:null };
function prepareQuestion(rawQ, type){
  if(type==='mc' || type==='finale' || type==='truefalse') return shuffleQuestionOptions(rawQ);
  if(type==='scramble') return { ...rawQ, scrambled: scrambleWord(rawQ.answer) };
  if(type==='order') return { ...rawQ, shuffled: shuffleArr(rawQ.words.map((w,i)=>({w,i}))) };
  return rawQ;
}
function getCurrentQuestion(){
  let rawQ, type, key;
  if(progress.destination){
    const dest = DESTINATIONS[progress.destination];
    const stop = dest.stops[progress.destStopIdx];
    rawQ = stop.questions[progress.destQIdx];
    type = 'mc';
    key = 'dest-'+progress.destStopIdx+'-'+progress.destQIdx;
  } else {
    const stop = currentStop();
    rawQ = stop.questions[progress.qIdx];
    type = rawQ.type || stop.type;
    key = 'main-'+progress.stopIdx+'-'+progress.qIdx;
  }
  if(preparedQCache.key !== key){
    preparedQCache = { key, q: prepareQuestion(rawQ, type) };
  }
  return { q: preparedQCache.q, type };
}

function continueJourney(){
  const stop = currentStop();
  const { q, type } = getCurrentQuestion();
  const pv = stop.pointValue || 1;
  const correct = isAnswerCorrect(type, q);
  if(correct) progress.score += pv;
  const st = progress.stopStats[stop.id] || {correct:0,total:0,points:0};
  st.total++; if(correct){ st.correct++; st.points+=pv; }
  progress.stopStats[stop.id] = st;

  if(progress.qIdx < stop.questions.length-1){
    progress.qIdx++;
  } else if(progress.stopIdx < MAP_STOPS.length-1){
    progress.stopIdx++;
    progress.qIdx = 0;
  } else {
    progress.reachedAirport = true;
  }
  resetAnswerUi();
  saveProgress();
  render();
}
function chooseDestination(code){
  const dest = DESTINATIONS[code];
  progress.destination = code;
  progress.destStopIdx = 0; progress.destQIdx = 0; progress.destScore = 0; progress.destFinished = false;
  resetAnswerUi();
  saveProgress();
  ui.screen = 'stage';
  render();
}
function declineDestination(){
  progress.finished = true;
  saveProgress();
  ui.screen = 'finish';
  render();
}
function continueDestJourney(){
  const dest = DESTINATIONS[progress.destination];
  const stop = dest.stops[progress.destStopIdx];
  const { q } = getCurrentQuestion();
  if(isAnswerCorrect('mc', q)) progress.destScore += 1;

  if(progress.destQIdx < stop.questions.length-1){
    progress.destQIdx++;
  } else if(progress.destStopIdx < dest.stops.length-1){
    progress.destStopIdx++;
    progress.destQIdx = 0;
  } else {
    progress.destFinished = true;
    progress.finished = true;
  }
  resetAnswerUi();
  saveProgress();
  if(progress.finished){ ui.screen = 'finish'; }
  render();
}
function pickOrderWord(idx){
  const { q } = getCurrentQuestion();
  ui.orderPicks.push(q.shuffled[idx].w);
  render();
}
function unpickOrderWord(i){ ui.orderPicks.splice(i,1); render(); }

           <button class="btn btn-gold" onclick="app.continueStageAuto()">Pokračovať →</button>`}
    </div>
  `;
}
function renderOptionsBody(type, q, pv){
  const isTF = type==='truefalse';
  const answered = ui.pickedOption!==null;
  const correct = answered && isAnswerCorrect(type, q);
  return `
    ${type==='finale' ? `<p class="prompt-sk">${esc(q.label||'')}</p><p class="prompt-main" style="font-size:clamp(20px,5.2vw,50px);word-break:break-word;">${esc(q.word)}</p>`
      : isTF ? `<p class="prompt-sk">Pravda, alebo nepravda?</p><p class="sentence">${esc(q.statement)}</p>`
      : `<p class="prompt-sk">Slovenské slovo</p><p class="prompt-main">${esc(q.sk)}</p>`}
    <div class="options">
      ${q.options.map((opt,i)=>{
        let cls='opt';
        if(ui.revealed && i===q.answer) cls+=' reveal-correct';
        else if(ui.revealed && i===ui.pickedOption) cls+=' reveal-wrong';
        else if(!ui.revealed && i===ui.pickedOption) cls+=' picked';
        return `<button class="${cls}" ${ui.revealed?'disabled':''} onclick="app.pickOption(${i})">${isTF?'':`<span class="letter">${String.fromCharCode(65+i)}</span>`}${esc(opt)}</button>`;
      }).join('')}
    </div>
    ${ui.revealed && q.trapNote ? `<div class="reveal-box"><p class="hint" style="margin:0;">⚠️ ${esc(q.trapNote)}</p></div>` : ''}

function renderTextBody(type, q, pv){
  let promptHtml;
  if(type==='fill'){
    const parts = q.sentence.split('___');
    promptHtml = `<p class="prompt-sk">Doplň chýbajúce slovo</p><p class="sentence">${esc(parts[0])}<span class="blank">${ui.revealed?esc(q.answer):'_____'}</span>${esc(parts[1]||'')}</p>`;
  } else if(type==='riddle'){
    promptHtml = `<p class="prompt-sk">Anglická hádanka</p><p class="sentence">${esc(q.riddle)}</p>`;
  } else if(type==='scramble'){
    promptHtml = `<p class="prompt-sk">Rozlúšti popletené písmenká${q.sk?` (${esc(q.sk)})`:''}</p><p class="scramble-word">${esc(q.scrambled.toUpperCase().split('').join(' '))}</p>`;
  } else {
    promptHtml = `<p class="prompt-sk">Čo to znamená po anglicky?</p><p class="prompt-main emoji">${q.emoji}</p>`;
  }
  const answered = ui.textAnswer.trim()!=='';
  const correct = answered && isAnswerCorrect(type, q);
  return `
    ${promptHtml}
    <div class="text-answer-wrap">
      <input type="text" class="text-answer-input ${ui.revealed?(correct?'ok':'bad'):''}" ${ui.revealed?'disabled':''}
        placeholder="Napíš odpoveď po anglicky…" value="${esc(ui.textAnswer)}"
        oninput="app.setTextAnswer(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault(); app.revealJourney();}"
        autocomplete="off" autocapitalize="off" spellcheck="false" />
    </div>
    ${ui.revealed && type!=='fill' ? `<div class="reveal-box"><div class="answer-pill"><span class="en">${esc(q.answer)}</span>${q.sk&&type!=='scramble'?`<span class="sk">${esc(q.sk)}</span>`:''}</div></div>` : ''}
    ${renderAutoControls(correct, answered, pv)}
  `;
}
function renderOrderBody(q, pv){
  const pickedSlots = [];
  ui.orderPicks.forEach(w=>{
    const slot = q.shuffled.findIndex((item,idx)=>item.w===w && !pickedSlots.includes(idx));
    if(slot>=0) pickedSlots.push(slot);
  });
  const answered = ui.orderPicks.length>0;
  const correct = answered && isAnswerCorrect('order', q);
  return `
    <p class="prompt-sk">Poskladaj vetu v správnom poradí</p>
    ${q.sk?`<p class="hint" style="text-align:center;margin-top:-8px;">${esc(q.sk)}</p>`:''}
    <div class="order-answer-row">
      ${ui.orderPicks.length
        ? ui.orderPicks.map((w,i)=>`<button class="order-chip picked" ${ui.revealed?'disabled':''} onclick="app.unpickOrderWord(${i})">${esc(w)}</button>`).join('')
        : '<span class="order-placeholder">Klikaj na slová nižšie v správnom poradí…</span>'}
    </div>
    <div class="order-bank">
      ${q.shuffled.map((item,idx)=>`<button class="order-chip bank" ${pickedSlots.includes(idx)||ui.revealed?'disabled':''} onclick="app.pickOrderWord(${idx})">${esc(item.w)}</button>`).join('')}

}

function myMapLocation(){
  if(!progress) return null;
  if(progress.destination) return { kind:'dest', code:progress.destination };
  if(progress.reachedAirport) return { kind:'zone', id:'letisko' };
  if(progress.passed===false || progress.passed===null) return { kind:'none' };
  const stop = currentStop();
  return stop ? { kind:'zone', id:stop.zone } : { kind:'zone', id:'letisko' };
}
function zoneProgress(zoneId){
  const stops = MAP_STOPS.filter(s=>s.zone===zoneId);
  const firstIdx = MAP_STOPS.indexOf(stops[0]);
  const lastIdx = MAP_STOPS.indexOf(stops[stops.length-1]);
  const curIdx = progress.reachedAirport ? MAP_STOPS.length : progress.stopIdx;
  let state = curIdx > lastIdx ? 'done' : (curIdx >= firstIdx && curIdx <= lastIdx ? 'current' : 'locked');
  let correct=0, total=0;
  stops.forEach(s=>{ const st=progress.stopStats[s.id]; if(st){ correct+=st.correct; total+=st.total; } });
  let pct;
  if(state==='done') pct = total>0 ? Math.round((correct/total)*100) : 100;
  else if(state==='current'){
    const stopsBeforeCurrent = stops.filter(s=>MAP_STOPS.indexOf(s)<progress.stopIdx);
    const doneQ = stopsBeforeCurrent.reduce((sum,s)=>sum+s.questions.length,0) + progress.qIdx;
    const totalQ = stops.reduce((sum,s)=>sum+s.questions.length,0);
    pct = totalQ>0 ? Math.round((doneQ/totalQ)*100) : 0;
  } else pct = 0;
  return { state, pct, correct, total };
}
function stopProgressInfo(stop){
  const idxInMap = MAP_STOPS.indexOf(stop);
  const curIdx = progress.reachedAirport ? MAP_STOPS.length : progress.stopIdx;
  const st = progress.stopStats[stop.id];
  if(idxInMap < curIdx || progress.reachedAirport){
    const total = st ? st.total : stop.questions.length;
    const correct = st ? st.correct : stop.questions.length;
    return { state:'done', label:`${correct}/${total} správne (${total?Math.round((correct/total)*100):100}%)`, pct: total?Math.round((correct/total)*100):100 };
  }
  if(idxInMap === curIdx){
    const pct = Math.round((progress.qIdx/stop.questions.length)*100);
    return { state:'current', label:`prebieha — otázka ${progress.qIdx+1}/${stop.questions.length}`, pct };
  }
  return { state:'locked', label:'ešte nezačaté', pct:0 };
}

        <div class="stop-detail-bar"><div class="stop-detail-fill ${info.state}" style="width:${info.pct}%;"></div></div>

          <h3>${zone.icon} ${esc(zone.label)}</h3>
          <button class="mini-btn" onclick="app.closePinDetail()" title="Zavrieť">✕</button>
        </div>
        ${rows}
      </div>
    </div>
  `;
}
function renderMapPage(){
  const me = myMapLocation();
  const myUid = currentUser ? currentUser.uid : 'me';
  const myName = progress.displayName || 'Ty';

  const pins = ZONES.map(z=>{
    const zp = zoneProgress(z.id);
    const isCurrent = me.kind==='zone' && me.id===z.id;
    return `
      <div class="map-pin ${isCurrent?'is-me':''} ${zp.state==='done'?'is-done':''}" style="left:${z.x}%;top:${(z.y/56*100)}%;--zc:${z.color};"
        onclick="app.openZoneDetail('${z.id}')" role="button" tabindex="0" title="Klikni pre detail">
        <div class="map-pin-drop"><span class="pin-scallop"></span><span class="map-pin-emoji">${zp.state==='done'?'✓':z.icon}</span></div>
        <div class="map-pin-pct ${zp.state}">${zp.state==='locked'?'🔒':zp.pct+'%'}</div>
        <div class="map-pin-shadow"></div>
        <div class="map-pin-label">${esc(z.label)}</div>
        ${isCurrent ? `<div class="map-pin-avatar" style="background:${avatarColor(myUid)};" title="${esc(myName)}">${initials(myName)}</div>` : ''}
      </div>
    `;
  }).join('');

  const destBadges = Object.values(DESTINATIONS).map(d=>{
    const isCurrent = me.kind==='dest' && me.code===d.code;
    const isDone = progress.destFinished && me.code===d.code;
    return `
      <div class="dest-badge ${isCurrent?'is-me-dest':''}">
        <div class="flag">${d.flag}</div>
        <div class="dtext">
          <div class="dlabel">${esc(d.name)}</div>
          <div class="dstatus">${isDone?'🏁 hotovo':(isCurrent?'✈️ si tu':'🔓 odomknuté na letisku')}</div>
        </div>
      </div>
    `;
  }).join('');

  const remaining = questionsRemainingInCurrentStop();
  const overallPct = journeyProgressPct(progress);
  const whereText = progress.destination
    ? `${DESTINATIONS[progress.destination].flag.replace(/<[^>]+>/g,'')} ${DESTINATIONS[progress.destination].name}`
    : (progress.reachedAirport ? '✈️ Letisko' : (currentStop() ? `${zoneOf(currentStop().zone).icon} ${esc(currentStop().title)}` : '—'));

  return `
    <div class="panel">
      <div class="map-summary">
        <div class="map-summary-item"><span class="ms-label">Si tu</span><span class="ms-value">${whereText}</span></div>
        <div class="map-summary-item"><span class="ms-label">Chýba do ďalšej zastávky</span><span class="ms-value">${remaining} ${remaining===1?'otázka':(remaining>=2&&remaining<=4?'otázky':'otázok')}</span></div>
        <div class="map-summary-item"><span class="ms-label">Celkový postup</span><span class="ms-value">${overallPct}%</span></div>
      </div>
      <div class="terrain-map-frame map-page-frame">
        <div class="terrain-map">
          <div class="terrain-clouds"></div>
          <span class="terrain-compass">🧭</span>
          <div class="sk-ribbon"><span class="flag-chip flag-sk"></span><span class="sr-label">Slovensko</span></div>
          <svg class="terrain-svg" viewBox="0 0 100 56" preserveAspectRatio="none">
            <defs>
              <marker id="mapArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="#a6875a" />
              </marker>
            </defs>
            <path class="terrain-border" d="M-2,6 C12,14 22,4 38,16 C52,26 58,10 74,18 C84,24 92,12 102,20" />
            <path class="terrain-border" d="M-2,50 C14,40 26,46 42,36 C58,26 68,34 84,26 C92,22 98,26 102,22" />
            <path class="terrain-path-shadow" d="${TERRAIN_PATH}" transform="translate(0.4,0.6)" />
            <path class="terrain-path-shadow" d="M90,16 C93,10 96,8 98,10" transform="translate(0.4,0.6)" />
            <path class="terrain-path" d="${TERRAIN_PATH}" marker-end="url(#mapArrow)" />
            <path class="terrain-branch" d="M90,16 C93,10 96,8 98,10" marker-end="url(#mapArrow)" />
          </svg>
          ${pins}
        </div>
      </div>
      <div class="dest-strip-wrap">
        <p class="dest-strip-title"><span class="arrow">✈️→</span> Destinácie z letiska</p>
        <div class="dest-strip">${destBadges}</div>
      </div>
      <div class="map-legend">
        <span><span class="legend-dot" style="box-shadow:0 0 0 3px rgba(73,180,124,.3);border-color:var(--correct);"></span> si tu práve teraz</span>
        <span>Číslo pri pine = % úspešnosti v tej zóne</span>
        <span>Klikni na pin pre podrobný rozpis podľa zastávok</span>
      </div>
      <div class="controls">
        <button class="btn btn-gold" onclick="app.closeMap()">← Späť do hry</button>
      </div>
    </div>
  `;
}

/* ================= main render ================= */
function render(){
  const el = document.getElementById('app');
  renderTopnav();
  let html = '';
  if(ui.screen==='loading') html = `<div class="panel intro-wrap"><p>Načítavam…</p></div>`;
  else if(ui.screen==='login') html = renderLogin();
  else if(ui.screen==='nickname') html = renderNickname();
  else if(ui.screen==='testIntro') html = renderTestIntro();
  else if(ui.screen==='testPlay') html = renderTestPlay();
  else if(ui.screen==='testResult') html = renderTestResult();
  else if(ui.screen==='stage') html = renderStage();
  else if(ui.screen==='finish') html = renderFinish();
  else if(ui.screen==='leaderboard') html = renderLeaderboard();
  else if(ui.screen==='diploma') html = renderDiploma();
  else if(ui.screen==='map') html = renderMapPage();
  el.innerHTML = html;
  renderPinDetailOverlay();
}

/* ================= expose to window (onclick handlers) ================= */
window.app = {
  setNameInput:(v)=>{ ui.nameInput=v; },
  signInWithGoogle, playAsGuest, saveNickname, beginTest, pickOption, revealTestQ, continueTest,
  startJourney, revealJourney, setTextAnswer, pickOrderWord, unpickOrderWord, continueStageAuto,
  chooseDestination, declineDestination, openLeaderboard, goPlay, doSignOut,
  openMap, closeMap, showDiploma, backToEnd, openZoneDetail, closePinDetail,
  __testFirestore: async ()=>{
    try{
      const ref = doc(db, 'progress', 'connectivity-test');
      await getDoc(ref);
      return 'ok: reachable (read allowed or doc simply empty)';
    }catch(e){ return 'error: '+e.code+' '+e.message; }
  },
};

handleAuthEntry();
</script>
